<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お弁当作成支援アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <button id="historyBtn">履歴</button>
  <button id="openNgModal" class="ng-btn">入れたくないもの</button>
</header>

<main>
　<div class="selector-area">

  　<!-- 朝食 -->
  　<div class="select-block">
    　<h3>朝食</h3>
    　<label>主食</label>
    　<select id="stapleMorning"></select>

    　<label>主菜</label>
    　<select id="mainMorning"></select>

    　<label>副菜</label>
    　<select id="sideMorning"></select>
  　</div>

  　<!-- 昼食 -->
  　<div class="select-block">
    　<h3>昼食</h3>
    　<label>主食</label>
    　<select id="stapleNoon"></select>

    　<label>主菜</label>
    　<select id="mainNoon"></select>

    　<label>副菜</label>
    　<select id="sideNoon"></select>
  　</div>

  　<!-- 夕食 -->
  　<div class="select-block">
    　<h3>夕食</h3>
    　<label>主食</label>
    　<select id="stapleNight"></select>

    　<label>主菜</label>
    　<select id="mainNight"></select>

    　<label>副菜</label>
    　<select id="sideNight"></select>
  　</div>

　</div>

  <button id="generateBtn">提案する</button>

</main>

<!-- 三食分の提案結果ポップアップ -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <span id="closeResultModal" class="close">&times;</span>
    <h3>三食分の提案結果</h3>
    <div id="resultPopupArea"></div>
    <button id="closeResultModalBottom" class="close-btn">閉じる</button>
  </div>
</div>

  
<!-- NGモーダル -->
<div id="ngModal" class="modal">
  <div class="modal-content">
    <span id="closeNgModal" class="close">&times;</span>
    <h3>入れたくないもの</h3>

    <div class="ng-category">
      <h4>主食</h4>
      <div id="ngStaple"></div>
    </div>

    <div class="ng-category">
      <h4>主菜</h4>
      <div id="ngMain"></div>
    </div>

    <div class="ng-category">
      <h4>副菜</h4>
      <div id="ngSide"></div>
    </div>

    <button id="closeNgModalBottom" class="close-btn">閉じる</button>
  </div>
</div>

<!-- 履歴ポップアップ -->
<div id="historyPopup" class="popup hidden">
  <div class="popup-content">
    <h3>過去3日分の履歴</h3>
    <div id="historyList"></div>
    <button id="closeHistory">閉じる</button>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
